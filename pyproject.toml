[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rlcheckers"
version = "0.1.0"
description = "A learning project: reinforcement learning for 5x5 checkers."
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running integration test"]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
